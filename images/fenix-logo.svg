<svg width="600" height="180" viewBox="0 0 600 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="FENIX">
  <defs>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd24b"/>
      <stop offset=".45" stop-color="#ff8a1f"/>
      <stop offset="1" stop-color="#d61f1f"/>
    </linearGradient>
    <linearGradient id="flame2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb43d"/>
      <stop offset="1" stop-color="#e0245e"/>
    </linearGradient>
  </defs>

  <!-- ===== PHOENIX EMBLEM (front view, wings up) ===== -->
  <g transform="translate(95,90)">
    <!-- left wing (mirrored group), flame feathers sweeping up-out -->
    <g>
      <!-- big outer feathers -->
      <path d="M0,-6 C-26,-18 -52,-30 -74,-58 C-66,-44 -58,-30 -56,-18 C-70,-30 -82,-46 -88,-66 C-84,-48 -78,-32 -72,-18 C-84,-30 -94,-48 -98,-70 C-94,-44 -84,-20 -64,-2 C-44,12 -20,16 0,12 Z" fill="#111" stroke="url(#flame)" stroke-width="3"/>
      <!-- inner flame feathers -->
      <path d="M-6,-2 C-26,-14 -44,-26 -58,-46 C-54,-32 -48,-20 -44,-10 C-56,-22 -66,-38 -70,-54 C-66,-34 -58,-14 -40,0 C-26,10 -12,12 -2,9 Z" fill="url(#flame)"/>
    </g>
    <g transform="scale(-1,1)">
      <path d="M0,-6 C-26,-18 -52,-30 -74,-58 C-66,-44 -58,-30 -56,-18 C-70,-30 -82,-46 -88,-66 C-84,-48 -78,-32 -72,-18 C-84,-30 -94,-48 -98,-70 C-94,-44 -84,-20 -64,-2 C-44,12 -20,16 0,12 Z" fill="#111" stroke="url(#flame)" stroke-width="3"/>
      <path d="M-6,-2 C-26,-14 -44,-26 -58,-46 C-54,-32 -48,-20 -44,-10 C-56,-22 -66,-38 -70,-54 C-66,-34 -58,-14 -40,0 C-26,10 -12,12 -2,9 Z" fill="url(#flame)"/>
    </g>

    <!-- head + crest -->
    <path d="M0,-58 C6,-50 7,-40 4,-30 C2,-24 -2,-24 -4,-30 C-7,-40 -6,-50 0,-58 Z" fill="url(#flame)"/>
    <circle cx="0" cy="-44" r="3" fill="#111"/>

    <!-- body -->
    <path d="M-10,-18 C-6,-2 -4,18 0,40 C4,18 6,-2 10,-18 C6,-26 -6,-26 -10,-18 Z" fill="#111" stroke="url(#flame)" stroke-width="2.5"/>

    <!-- tail feathers -->
    <path d="M0,30 C-10,44 -18,54 -16,70 C-12,58 -6,50 0,44 C6,50 12,58 16,70 C18,54 10,44 0,30 Z" fill="url(#flame2)"/>
    <path d="M0,34 L-6,66 M0,34 L0,70 M0,34 L6,66" stroke="#111" stroke-width="1.6"/>
  </g>

  <!-- ===== WORDMARK ===== -->
  <text x="210" y="120" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="92" fill="#e11d1d" letter-spacing="2" font-style="italic">FENIX</text>
</svg>
