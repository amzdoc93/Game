<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Двор — Soviet District Driving Sim</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0a0a0a; overflow: hidden;
               font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #eee;
               -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }

  #hud, #stats, #quality, #mission, #bars, #strikes, #toast {
    position: absolute; pointer-events: none;
    text-shadow: 0 1px 2px rgba(0,0,0,0.7);
  }
  #hud {
    top: 8px; left: 8px;
    padding: 8px 12px; background: rgba(0,0,0,0.45);
    border-radius: 10px; backdrop-filter: blur(6px);
    font-size: 12px; line-height: 1.5; max-width: 60vw;
  }
  #hud b { color: #ffd27a; }

  #stats {
    top: 8px; right: 8px;
    padding: 6px 10px; background: rgba(0,0,0,0.45);
    border-radius: 10px; font-size: 11px; font-variant-numeric: tabular-nums;
  }

  #mission {
    top: 70px; left: 8px; max-width: 60vw;
    padding: 8px 12px; background: rgba(0,0,0,0.55);
    border-radius: 10px; font-size: 12px; display: none;
  }
  #mission b { color: #ffcc55; }

  #bars {
    bottom: 8px; left: 8px;
    display: flex; flex-direction: column; gap: 6px;
    font-size: 11px;
  }
  .bar { width: 180px; height: 12px; border-radius: 6px; background: rgba(0,0,0,0.5); overflow: hidden; }
  .bar > div { height: 100%; transition: width 0.15s; }
  #hpBar > div      { background: linear-gradient(90deg,#d03333,#ff6a6a); width: 100%; }
  #stamBar > div    { background: linear-gradient(90deg,#eaa020,#ffe080); width: 100%; }
  #oppHpBar         { display: none; }
  #oppHpBar > div   { background: linear-gradient(90deg,#7a1a55,#ff6aaa); width: 100%; }
  .bar-label { color: #fff; font-weight: 600; margin-left: 6px; }

  #quality {
    bottom: 8px; right: 8px;
    padding: 6px 10px; background: rgba(0,0,0,0.45);
    border-radius: 8px; font-size: 11px; cursor: pointer; pointer-events: auto;
  }

  #toast {
    top: 45%; left: 50%; transform: translate(-50%,-50%);
    padding: 14px 22px; background: rgba(0,0,0,0.75);
    border-radius: 14px; font-size: 16px; text-align: center; min-width: 220px;
    display: none; border: 1px solid rgba(255,255,255,0.1);
  }

  /* Touch strike pad */
  #strikes {
    bottom: 8px; left: 50%; transform: translateX(-50%);
    display: none; pointer-events: none;
    grid-template-columns: repeat(5, 44px);
    gap: 4px;
  }
  #strikes button {
    pointer-events: auto;
    width: 44px; height: 44px; border-radius: 8px;
    background: rgba(20,20,30,0.75); color: #fff;
    border: 1px solid rgba(255,255,255,0.15);
    font-size: 10px; line-height: 1.1; font-weight: 600;
    font-family: inherit; cursor: pointer; user-select: none;
    padding: 2px;
  }
  #strikes button:active { background: rgba(200,100,50,0.8); }
  #strikes .tophalf { color: #ffd27a; font-size: 13px; }

  #foot-pad {
    position: absolute; bottom: 70px; left: 16px;
    width: 140px; height: 140px; display: none; pointer-events: auto;
    border-radius: 50%; background: rgba(20,20,30,0.35);
    border: 1px solid rgba(255,255,255,0.12);
  }
  #foot-nub {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    width: 54px; height: 54px; border-radius: 50%;
    background: rgba(180,180,200,0.5); border: 1px solid rgba(255,255,255,0.2);
  }
  #interact {
    position: absolute; bottom: 80px; right: 16px;
    width: 68px; height: 68px; border-radius: 50%;
    background: rgba(255,180,60,0.8); color: #000; font-weight: 700;
    display: none; pointer-events: auto; border: none; font-size: 14px;
  }
  #block-btn {
    position: absolute; bottom: 160px; right: 16px;
    width: 60px; height: 60px; border-radius: 50%;
    background: rgba(100,160,255,0.75); color: #fff; font-weight: 700;
    display: none; pointer-events: auto; border: none; font-size: 12px;
  }
  #block-btn:active { background: rgba(100,200,255,0.95); }

  #loading {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #0a0a0a; z-index: 10; font-size: 14px; letter-spacing: 0.1em;
  }
</style>
</head>
<body>
<div id="app">
  <div id="loading">LOADING…</div>

  <div id="hud">
    <div id="hud-car">
      <div><b>WASD</b> езда · <b>Space</b> ручник · <b>Shift</b> буст</div>
      <div><b>E</b> выйти · <b>C</b> камера · <b>L</b> фары · <b>Q</b> качество</div>
    </div>
    <div id="hud-foot" style="display:none">
      <div><b>WASD</b> ходить · <b>Shift</b> бег · <b>Space</b> блок</div>
      <div><b>1–0</b> удары · <b>E</b> сесть/войти</div>
    </div>
    <div id="hud-fight" style="display:none">
      <div><b>Бой 1×1.</b> <b>1–0</b> — 10 ударов · <b>Space</b> блок</div>
    </div>
  </div>

  <div id="stats">
    FPS: <span id="fps">—</span> · <span id="mode">HIGH</span> ·
    <span id="money">₽0</span>
  </div>

  <div id="mission">
    <div><b id="mission-name">—</b></div>
    <div id="mission-desc" style="opacity:.85">—</div>
    <div id="mission-progress" style="margin-top:4px;color:#9f9"></div>
  </div>

  <div id="bars">
    <div style="display:flex;align-items:center">
      <div class="bar" id="hpBar"><div></div></div>
      <span class="bar-label">HP</span>
    </div>
    <div style="display:flex;align-items:center">
      <div class="bar" id="stamBar"><div></div></div>
      <span class="bar-label">STAM</span>
    </div>
    <div style="display:flex;align-items:center">
      <div class="bar" id="oppHpBar"><div></div></div>
      <span class="bar-label">ENEMY</span>
    </div>
  </div>

  <div id="quality" title="Toggle quality">Quality: <span id="qlabel">HIGH</span></div>

  <div id="toast"></div>

  <div id="strikes">
    <button data-strike="jab">       <div class="tophalf">1</div>Jab</button>
    <button data-strike="cross">     <div class="tophalf">2</div>Cross</button>
    <button data-strike="leftHook">  <div class="tophalf">3</div>L Hook</button>
    <button data-strike="rightHook"> <div class="tophalf">4</div>R Hook</button>
    <button data-strike="leftUpper"> <div class="tophalf">5</div>L Upp</button>
    <button data-strike="rightUpper"><div class="tophalf">6</div>R Upp</button>
    <button data-strike="lowKick">   <div class="tophalf">7</div>L Kick</button>
    <button data-strike="highKick">  <div class="tophalf">8</div>H Kick</button>
    <button data-strike="knee">      <div class="tophalf">9</div>Knee</button>
    <button data-strike="elbow">     <div class="tophalf">0</div>Elbow</button>
  </div>

  <div id="foot-pad"><div id="foot-nub"></div></div>
  <button id="interact">E</button>
  <button id="block-btn">BLOCK</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
