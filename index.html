<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Двор — Soviet District Driving Sim</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0a0a0a; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #eee; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  #hud {
    position: absolute; top: 12px; left: 12px;
    padding: 10px 14px; background: rgba(0,0,0,0.45);
    border-radius: 10px; backdrop-filter: blur(6px);
    font-size: 13px; line-height: 1.5; pointer-events: none;
    text-shadow: 0 1px 2px rgba(0,0,0,0.7);
  }
  #hud b { color: #ffd27a; }
  #stats {
    position: absolute; top: 12px; right: 12px;
    padding: 8px 12px; background: rgba(0,0,0,0.45);
    border-radius: 10px; font-size: 12px; font-variant-numeric: tabular-nums;
  }
  #quality {
    position: absolute; bottom: 12px; right: 12px;
    padding: 6px 10px; background: rgba(0,0,0,0.45);
    border-radius: 8px; font-size: 12px; cursor: pointer; user-select: none;
  }
  #quality:hover { background: rgba(0,0,0,0.65); }
  #loading {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #0a0a0a; z-index: 10; font-size: 14px; letter-spacing: 0.1em;
  }
</style>
</head>
<body>
<div id="app">
  <div id="loading">LOADING…</div>
  <div id="hud">
    <div><b>WASD</b> — drive · <b>Space</b> — handbrake · <b>Shift</b> — boost</div>
    <div><b>C</b> — camera · <b>L</b> — headlights · <b>Q</b> — toggle quality</div>
  </div>
  <div id="stats">FPS: <span id="fps">—</span> · <span id="mode">HIGH</span></div>
  <div id="quality" title="Toggle quality">Quality: <span id="qlabel">HIGH</span></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
